services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obilet-journey-search-web
    ports:
      - "5000:8080"
    env_file:
      - src/Obilet.JourneySearch.Web/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - obilet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  obilet-network:
    driver: bridge
